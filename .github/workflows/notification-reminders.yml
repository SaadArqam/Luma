name: Trigger daily reminders
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder endpoint
        run: |
          curl -X POST https://paisatrack.vercel.app/api/notifications/send-reminders \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
